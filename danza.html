<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--fucsia:#ff0080;--fucsia-dark:#cc0066;--text:#111;--muted:#777;--border:#e8e8e8;--bg2:#f9f9f9;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',sans-serif;}
html{scroll-behavior:smooth;}
body{background:#fff;color:var(--text);font-family:var(--serif);overflow-x:hidden;}
nav{position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(255,255,255,0.97);border-bottom:1px solid var(--border);padding:0.8rem 2.5rem;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(8px);}
.nav-logo{font-family:var(--sans);font-size:0;text-transform:uppercase;color:var(--text);text-decoration:none;display:flex;align-items:baseline;}
.logo-j,.logo-m{font-size:1.1rem;font-weight:500;color:var(--fucsia);}
.logo-ayro,.logo-ontesinos,.logo-space{font-size:0.42rem;letter-spacing:0.18em;color:var(--text);}
.nav-links{display:flex;gap:2rem;align-items:center;}
.nav-link{font-family:var(--sans);font-size:0.46rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color 0.3s;}
.nav-link:hover{color:var(--fucsia);}
.lang-wrap{display:flex;gap:0.3rem;align-items:center;}
.lang-btn{font-family:var(--sans);font-size:0.44rem;background:none;border:none;cursor:pointer;color:#bbb;transition:color 0.3s;}
.lang-btn.on{color:var(--fucsia);}
.lang-sep{color:#ddd;font-size:0.44rem;}
.page-header{padding:6rem 2.5rem 2.5rem;border-bottom:1px solid var(--border);}
.eyebrow{font-family:var(--sans);font-size:0.46rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--fucsia);margin-bottom:0.7rem;}
.page-header h1{font-family:var(--serif);font-size:clamp(2.5rem,5vw,4rem);font-weight:300;}
.page-header h1 em{font-style:italic;color:var(--fucsia);}
.page-desc{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:0.9rem;margin-top:0.6rem;line-height:1.7;max-width:500px;}
.gallery-section{padding:3rem 2rem;}
.masonry{columns:3;column-gap:6px;}
.masonry-item{break-inside:avoid;margin-bottom:6px;position:relative;overflow:hidden;cursor:pointer;}
.masonry-item img{width:100%;display:block;transition:transform 0.5s ease;}
.masonry-item:hover img{transform:scale(1.03);}
.masonry-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.65) 0%,transparent 50%);opacity:0;transition:opacity 0.3s;display:flex;flex-direction:column;justify-content:flex-end;padding:1rem;}
.masonry-item:hover .masonry-overlay{opacity:1;}
.photo-title{font-family:var(--serif);font-size:0.9rem;font-style:italic;color:#fff;}
.photo-price{font-family:var(--sans);font-size:0.42rem;letter-spacing:0.15em;color:rgba(255,255,255,0.6);margin-top:0.2rem;}
#lightbox{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;}
#lightbox.show{display:flex;}
#lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;}
#lb-close{position:absolute;top:1.5rem;right:1.5rem;color:rgba(255,255,255,0.5);font-size:2rem;cursor:pointer;background:none;border:none;}
#lb-close:hover{color:#fff;}
#lb-prev,#lb-next{position:absolute;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.4);font-size:2rem;cursor:pointer;background:none;border:none;padding:1rem;}
#lb-prev{left:1rem;}#lb-next{right:1rem;}
#lb-prev:hover,#lb-next:hover{color:var(--fucsia);}
footer{background:var(--text);padding:2rem 2.5rem;margin-top:2rem;}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.footer-copy{font-family:var(--sans);font-size:0.4rem;letter-spacing:0.1em;color:rgba(255,255,255,0.18);}
.footer-copy a{color:var(--fucsia);text-decoration:none;}
.footer-back{font-family:var(--sans);font-size:0.42rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.3);text-decoration:none;transition:color 0.3s;}
.footer-back:hover{color:var(--fucsia);}
@media(max-width:768px){nav{padding:0.8rem 1.2rem;}.nav-links{display:none;}.page-header{padding:5rem 1.2rem 2rem;}.gallery-section{padding:2rem 1rem;}.masonry{columns:2;}}

.buy-buttons{display:flex;gap:0.4rem;margin-top:0.5rem;flex-wrap:wrap;}
.buy-btn{font-family:var(--sans);font-size:0.4rem;letter-spacing:0.1em;text-transform:uppercase;color:#fff;background:var(--fucsia);border:none;padding:0.4rem 0.7rem;cursor:pointer;text-decoration:none;display:inline-block;transition:background 0.2s;}
.buy-btn:hover{background:var(--fucsia-dark);}
</style>

</nav>

  </div>
</footer>
<script>
let lang='en',lbIdx=0;
const photos=[
  {src:'imagenes/danza/danza-01.jpg',title:'Dance 01'},
  {src:'imagenes/danza/danza-02.jpg',title:'Dance 02'},
  {src:'imagenes/danza/danza-03.jpg',title:'Dance 03'},
  {src:'imagenes/danza/danza-04.jpg',title:'Dance 04'},
  {src:'imagenes/danza/danza-05.jpg',title:'Dance 05'},
  {src:'imagenes/danza/danza-06.jpg',title:'Dance 06'},
  {src:'imagenes/danza/danza-07.jpg',title:'Dance 07'},
  {src:'imagenes/danza/danza-08.jpg',title:'Dance 08'},
  {src:'imagenes/danza/danza-09.jpg',title:'Dance 09'},
  {src:'imagenes/danza/danza-10.jpg',title:'Dance 10'},
  {src:'imagenes/danza/danza-11.jpg',title:'Dance 11'},
  {src:'imagenes/danza/danza-12.jpg',title:'Dance 12'},
  {src:'imagenes/danza/danza-13.jpg',title:'Dance 13'},
  {src:'imagenes/danza/danza-14.jpg',title:'Dance 14'},
  {src:'imagenes/danza/danza-15.jpg',title:'Dance 15'},
  {src:'imagenes/danza/danza-16.jpg',title:'Dance 16'},
  {src:'imagenes/danza/danza-17.jpg',title:'Dance 17'},
  {src:'imagenes/danza/danza-18.jpg',title:'Dance 18'},

  {src:'imagenes/danza/danza-21.jpg',title:'Dance 21'},

  {src:'imagenes/danza/danza-23.jpg',title:'Dance 23'},
  {src:'imagenes/danza/danza-24.jpg',title:'Dance 24'},
  {src:'imagenes/danza/danza-25.jpg',title:'Dance 25'},
  {src:'imagenes/danza/danza-26.jpg',title:'Dance 26'},
  {src:'imagenes/danza/danza-27.jpg',title:'Dance 27'},

  {src:'imagenes/danza/danza-30.jpg',title:'Dance 30'},
  {src:'imagenes/danza/danza-31.jpg',title:'Dance 31'},
];
function build(){
  const m=document.getElementById('masonry');
  photos.forEach((p,i)=>{
    const div=document.createElement('div');
    div.className='masonry-item';
    div.onclick=()=>openLB(i);
    const priceHtml=p.price?`<div class="photo-price">${p.price}</div>`:'';
    div.innerHTML=`<img src="${p.src}" alt="${p.title}" loading="lazy"><div class="masonry-overlay"><div class="photo-title">${p.title}</div>${priceHtml}</div>`;
    m.appendChild(div);
  });
}
build();
function openLB(i){lbIdx=i;document.getElementById('lb-img').src=photos[i].src;document.getElementById('lightbox').classList.add('show');}
function closeLB(){document.getElementById('lightbox').classList.remove('show');}
function moveLB(d){lbIdx=(lbIdx+d+photos.length)%photos.length;document.getElementById('lb-img').src=photos[lbIdx].src;}
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===document.getElementById('lightbox'))closeLB();});
function setLang(l){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('on',b.textContent.toLowerCase()===l));document.querySelectorAll('[data-en]').forEach(el=>{const t=el.getAttribute('data-'+l);if(t)el.innerHTML=t;});}
</script>
